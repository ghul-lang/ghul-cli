name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Serialise release builds so concurrent pushes to main can't race over the
# version number; PR builds keep their own per-ref group and cancel
# superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # Patch bump the latest vX.Y.Z tag unless VERSION declares a higher
    # minor/major floor. Pull request builds get a -beta.<run> suffix so
    # they can't collide with a real release.
    - name: Determine the version
      id: version
      uses: ghul-lang/create-version@v1.0.0
      with:
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

  unit_tests:
    name: Unit tests
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - name: Restore local tools
      run: dotnet tool restore

    - name: Run unit tests
      run: dotnet test unit-tests

  build_and_smoke_test:
    name: Build and smoke test
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Restore local tools
      run: dotnet tool restore

    - name: Run smoke test
      run: ./tests/smoke.sh

    - name: Run the Jupyter kernel test
      run: ./tests/jupyter.sh

    # Every package carries the run's version: they are released together
    # from one repository, and the tool bundles the library it references.
    - name: Create packages
      run: |
        dotnet pack -nologo cli/ghul-cli.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo repl/repl.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo host/host.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo jupyter/jupyter.ghulproj -p:Version=${{ needs.version.outputs.package }}

    - uses: actions/upload-artifact@v7
      with:
        name: package
        path: nupkg

  # Advisory for now: not among what the release waits for, until it has
  # shown it is reliable.
  windows:
    name: Windows smoke test
    needs: [version]
    runs-on: windows-latest

    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local tools
      run: dotnet tool restore

    - name: Run unit tests
      run: dotnet test unit-tests

    - name: Run the Windows smoke test
      shell: pwsh
      run: ./tests/smoke-windows.ps1

  publish_package:
    name: Publish package
    needs: [version, unit_tests, build_and_smoke_test]

    timeout-minutes: 10

    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      # Lets the job ask GitHub for the short-lived token nuget.org trades
      # for a publishing key. Nothing here holds a NuGet secret.
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    # Trusted publishing: nuget.org trades a token GitHub signs for this
    # workflow for a publishing key that lasts an hour and is spent once. No
    # long-lived key exists to leak or to rotate, and the policy on
    # nuget.org names this repository and this file, so no other workflow
    # can publish.
    - name: Ask nuget.org for a publishing key
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish package to NuGet
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate \
          --no-symbols

  create_release:
    needs: [version, publish_package]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul.cli.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.repl.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.repl.host.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.jupyter.${{ needs.version.outputs.package }}.nupkg \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt

