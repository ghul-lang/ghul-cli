name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Serialise release builds so concurrent pushes to main can't race over the
# version number; PR builds keep their own per-ref group and cancel
# superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # Patch bump the latest vX.Y.Z tag unless VERSION declares a higher
    # minor/major floor. Pull request builds get a -beta.<run> suffix so
    # they can't collide with a real release.
    - name: Determine the version
      id: version
      uses: ghul-lang/create-version@v1.0.0
      with:
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

  unit_tests:
    name: Unit tests
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - name: Restore local tools
      run: dotnet tool restore

    # The tool manifest's pin is only a local-dev fallback; this
    # repoints at the latest published ghul.compiler so the build
    # compiles this project's own sources with the newest compiler
    # regardless of when the manifest was last bumped.
    - name: Update the local ghul.compiler to the latest published
      run: dotnet tool update --local ghul.compiler

    - name: Run unit tests
      run: dotnet test unit-tests

  build_and_smoke_test:
    name: Build and smoke test
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Restore local tools
      run: dotnet tool restore

    # The tool manifest's pin is only a local-dev fallback; this
    # repoints at the latest published ghul.compiler so the build
    # compiles this project's own sources with the newest compiler
    # regardless of when the manifest was last bumped.
    - name: Update the local ghul.compiler to the latest published
      run: dotnet tool update --local ghul.compiler

    - name: Run smoke test
      run: ./tests/smoke.sh

    # A wasm program runs under Node.js, which needs WebAssembly GC: on by
    # default from Node.js 22.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Run the project test
      run: ./tests/project.sh

    - name: Run the Jupyter kernel test
      run: ./tests/jupyter.sh

    # Every package carries the run's version: they are released together
    # from one repository, and the tool bundles the library it references.
    - name: Create packages
      run: |
        dotnet pack -nologo cli/ghul-cli.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo repl/repl.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo host/host.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo jupyter/jupyter.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo project/project.ghulproj -p:Version=${{ needs.version.outputs.package }}

    - uses: actions/upload-artifact@v7
      with:
        name: package
        path: nupkg

  # Advisory for now: not among what the release waits for, until it has
  # shown it is reliable.
  windows:
    name: Windows smoke test
    needs: [version]
    runs-on: windows-latest

    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local tools
      run: dotnet tool restore

    # The tool manifest's pin is only a local-dev fallback; this
    # repoints at the latest published ghul.compiler so the build
    # compiles this project's own sources with the newest compiler
    # regardless of when the manifest was last bumped.
    - name: Update the local ghul.compiler to the latest published
      run: dotnet tool update --local ghul.compiler

    - name: Run unit tests
      run: dotnet test unit-tests

    - name: Run the Windows smoke test
      shell: pwsh
      run: ./tests/smoke-windows.ps1

  publish_package:
    name: Publish package
    needs: [version, unit_tests, build_and_smoke_test]

    timeout-minutes: 10

    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      # Lets the job ask GitHub for the short-lived token nuget.org trades
      # for a publishing key. Nothing here holds a NuGet secret.
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    # Trusted publishing: nuget.org trades a token GitHub signs for this
    # workflow for a publishing key that lasts an hour and is spent once. No
    # long-lived key exists to leak or to rotate, and the policy on
    # nuget.org names this repository and this file, so no other workflow
    # can publish.
    - name: Ask nuget.org for a publishing key
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish package to NuGet
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate \
          --no-symbols

  # What a user installs when they have no .NET: the tool compiled with
  # Native AOT, and the Native AOT compiler it ships beside it. Both are
  # statically linked and run with nothing but the C library, so the install
  # needs no SDK, no runtime, and no build tooling - the runner has a C
  # toolchain, and that is the only place one appears.
  aot_release_archive:
    name: Build the Native AOT archive
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 25

    # Release-only: the archive is an artifact of a release, and the job is
    # the slowest one here.
    if: ${{ github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local tools
      run: dotnet tool restore

    # The tool manifest's pin is only a local-dev fallback; this
    # repoints at the latest published ghul.compiler so the build
    # compiles this project's own sources with the newest compiler
    # regardless of when the manifest was last bumped.
    - name: Update the local ghul.compiler to the latest published
      run: dotnet tool update --local ghul.compiler

    # Published under the name the tool command is, since the binary the
    # project produces is named after the project.
    - name: Build the tool with Native AOT
      shell: bash
      run: |
        set -euo pipefail
        dotnet publish cli/ghul-cli.ghulproj -c Release -r linux-x64 \
          -p:PublishAot=true \
          -p:Version=${{ needs.version.outputs.package }} \
          -o build

        mv build/ghul-cli build/ghul

        # The native build's debug symbols: 25MB against a tool that is 8,
        # and nothing a user runs reads them.
        rm -f build/ghul-cli.dbg

    # The tool reads its own version by reflection off the assembly the
    # build produced, so a publish that forgets to be told the version
    # ships a tool that calls itself 1.0.0 - which is the MSBuild default,
    # and which nothing else in this job would notice. Checked rather than
    # assumed.
    - name: Check the tool reports this release's version
      shell: bash
      run: |
        set -euo pipefail
        reported="$(build/ghul --version 2>&1 | head -n 1)"
        echo "${reported}"

        if ! printf '%s' "${reported}" | grep -q -- "${{ needs.version.outputs.package }}"; then
          echo "the tool reports '${reported}'; expected version ${{ needs.version.outputs.package }}" >&2
          exit 1
        fi

    # `ghul update` takes its update path only in the Native AOT build, so it
    # is tested here, against a release mirror on the file system, rather
    # than in the smoke test, which runs the managed build.
    - name: Test ghul update
      shell: bash
      run: ./tests/update.sh build/ghul

    # The newest compiler release, rather than a pinned one: the archive is
    # what a user installs to get going, and a compiler a version behind is
    # what they then have to update. The job fails if that release has no
    # Native AOT archive, which is the honest signal that the compiler has
    # not shipped one yet.
    - name: Fetch the Native AOT compiler
      shell: bash
      run: |
        set -euo pipefail
        compiler=$(
          curl -fsSL https://api.nuget.org/v3-flatcontainer/ghul.compiler/index.json \
            | tr ',' '\n' \
            | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' \
            | tr -d '"' \
            | sort -V \
            | tail -n 1
        )

        if [ -z "${compiler}" ]; then
          echo "no ghul.compiler release could be read from the feed" >&2
          exit 1
        fi

        echo "compiler=${compiler}" >>"$GITHUB_ENV"
        echo "shipping ghul.compiler ${compiler}"

        url="https://github.com/ghul-lang/ghul/releases/download/v${compiler}/ghul-compiler-linux-x64.tar.gz"

        if ! curl -fsSL "${url}" -o compiler.tar.gz; then
          echo "ghul.compiler ${compiler} has no Native AOT archive at ${url}" >&2
          exit 1
        fi

        mkdir -p "build/compilers/${compiler}"
        tar -xzf compiler.tar.gz -C "build/compilers/${compiler}" --strip-components=1

    # The one property this whole thing exists for: what is installed runs
    # on its own. A binary that had picked up a dependency on the .NET
    # runtime, or an archive that carried a toolchain, would still install
    # and would still fail on the user's machine, so it is refused here
    # rather than shipped.
    - name: Check the archive is self-contained
      shell: bash
      run: |
        set -euo pipefail

        # The version the step before wrote to $GITHUB_ENV is already in
        # this step's environment; $GITHUB_ENV itself is a different file
        # for every step, so it is read from the environment and not from
        # there.
        payload="build/compilers/${compiler:?the compiler version was not passed through}"

        for binary in build/ghul "${payload}/ghul-compiler"; do
          if [ ! -x "${binary}" ]; then
            echo "${binary} is not executable" >&2
            exit 1
          fi

          if ldd "${binary}" 2>/dev/null | grep -qiE 'libcoreclr|libhostfxr|libhostpolicy|libstdc\+\+'; then
            echo "${binary} links a runtime or toolchain library:" >&2
            ldd "${binary}" >&2
            exit 1
          fi

          echo "${binary}: $(ldd "${binary}" | grep -c '=>' ) shared libraries, none of them .NET"
        done

        # The archive holds the tool and one compiler, and nothing else: no
        # toolchain, no runtime, no package, no debug symbols. The list is
        # named rather than counted, so anything that turns up unexpected -
        # a stray runtime file, a leftover from the publish - fails here
        # rather than shipping and breaking on the user's machine.
        actual="$(cd build && find . -type f | sed 's|^\./||' | sort)"

        expected=$(printf '%s\n' \
          "ghul" \
          "compilers/${compiler}/analysis-protocol.runtimeconfig.json" \
          "compilers/${compiler}/ghul-compiler" \
          "compilers/${compiler}/ghul-runtime.dll" \
          "compilers/${compiler}/requirements.json" \
          "compilers/${compiler}/wasm.dll" \
          | sort)

        if ! diff -u <(printf '%s\n' "${expected}" | sort) <(printf '%s\n' "${actual}"); then
          echo "the payload is not the tool and one compiler" >&2
          exit 1
        fi

        echo "payload is exactly the tool and one compiler."

    - name: Pack the archive
      shell: bash
      run: |
        set -euo pipefail
        tar -czf ghul-cli-linux-x64.tar.gz -C build ghul compilers
        cp install.sh ghul-cli-install.sh
        sha256sum ghul-cli-linux-x64.tar.gz >ghul-cli-linux-x64.tar.gz.sha256
        sha256sum ghul-cli-install.sh >ghul-cli-install.sh.sha256

    - uses: actions/upload-artifact@v7
      with:
        name: aot-archive
        path: |
          ghul-cli-linux-x64.tar.gz
          ghul-cli-linux-x64.tar.gz.sha256
          ghul-cli-install.sh
          ghul-cli-install.sh.sha256

  create_release:
    needs: [version, publish_package, aot_release_archive]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Download the Native AOT archive
      uses: actions/download-artifact@v8
      with:
        name: aot-archive
        path: aot

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul.cli.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.repl.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.repl.host.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.jupyter.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.project.${{ needs.version.outputs.package }}.nupkg \
          ./aot/ghul-cli-linux-x64.tar.gz \
          ./aot/ghul-cli-linux-x64.tar.gz.sha256 \
          ./aot/ghul-cli-install.sh \
          ./aot/ghul-cli-install.sh.sha256 \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt

