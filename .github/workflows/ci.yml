name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Serialise release builds so concurrent pushes to main can't race over the
# version number; PR builds keep their own per-ref group and cancel
# superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # Patch bump the latest vX.Y.Z tag unless VERSION declares a higher
    # minor/major floor. Pull request builds get a -beta.<run> suffix so
    # they can't collide with a real release.
    - name: Determine the version
      id: version
      uses: ghul-lang/create-version@v1.0.0
      with:
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

  unit_tests:
    name: Unit tests
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - name: Restore local tools
      run: dotnet tool restore

    # The tool manifest's pin is only a local-dev fallback; this
    # repoints at the latest published ghul.compiler so the build
    # compiles this project's own sources with the newest compiler
    # regardless of when the manifest was last bumped.
    - name: Update the local ghul.compiler to the latest published
      run: dotnet tool update --local ghul.compiler

    - name: Run unit tests
      run: dotnet test unit-tests

  build_and_smoke_test:
    name: Build and smoke test
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Restore local tools
      run: dotnet tool restore

    # The tool manifest's pin is only a local-dev fallback; this
    # repoints at the latest published ghul.compiler so the build
    # compiles this project's own sources with the newest compiler
    # regardless of when the manifest was last bumped.
    - name: Update the local ghul.compiler to the latest published
      run: dotnet tool update --local ghul.compiler

    # A wasm program runs under Node.js: scripts and projects both build for
    # wasm, so it is needed from the smoke test on.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Run smoke test
      run: ./tests/smoke.sh

    - name: Run the project test
      run: ./tests/project.sh

    - name: Run the Jupyter kernel test
      run: ./tests/jupyter.sh

    # Every package carries the run's version: they are released together
    # from one repository, and the tool bundles the library it references.
    - name: Create packages
      run: |
        dotnet pack -nologo cli/ghul-cli.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo repl/repl.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo host/host.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo jupyter/jupyter.ghulproj -p:Version=${{ needs.version.outputs.package }}
        dotnet pack -nologo project/project.ghulproj -p:Version=${{ needs.version.outputs.package }}

    - uses: actions/upload-artifact@v7
      with:
        name: package
        path: nupkg

  # Advisory for now: not among what the release waits for, until it has
  # shown it is reliable.
  windows:
    name: Windows smoke test
    needs: [version]
    runs-on: windows-latest

    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local tools
      run: dotnet tool restore

    # The tool manifest's pin is only a local-dev fallback; this
    # repoints at the latest published ghul.compiler so the build
    # compiles this project's own sources with the newest compiler
    # regardless of when the manifest was last bumped.
    - name: Update the local ghul.compiler to the latest published
      run: dotnet tool update --local ghul.compiler

    - name: Run unit tests
      run: dotnet test unit-tests

    # Scripts build for wasm, which runs under Node.js.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Run the Windows smoke test
      shell: pwsh
      run: ./tests/smoke-windows.ps1

  publish_package:
    name: Publish package
    needs: [version, unit_tests, build_and_smoke_test]

    timeout-minutes: 10

    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      # Lets the job ask GitHub for the short-lived token nuget.org trades
      # for a publishing key. Nothing here holds a NuGet secret.
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    # Trusted publishing: nuget.org trades a token GitHub signs for this
    # workflow for a publishing key that lasts an hour and is spent once. No
    # long-lived key exists to leak or to rotate, and the policy on
    # nuget.org names this repository and this file, so no other workflow
    # can publish.
    - name: Ask nuget.org for a publishing key
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish package to NuGet
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate \
          --no-symbols

  # What a user installs when they have no .NET: the tool compiled with
  # Native AOT, which runs with nothing but the C library, so the install
  # needs no SDK, no runtime, and no build tooling - the runner has a C
  # toolchain, and that is the only place one appears. The compiler is not in
  # the archive: the first build fetches one, so the two versions are not
  # tied together.
  aot_release_archive:
    name: Build the Native AOT archive
    needs: [version]
    runs-on: ubuntu-latest

    timeout-minutes: 25

    # Release-only: the archive is an artifact of a release, and the job is
    # the slowest one here.
    if: ${{ github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local tools
      run: dotnet tool restore

    # Published under the name the tool command is, since the binary the
    # project produces is named after the project.
    - name: Build the tool with Native AOT
      shell: bash
      run: |
        set -euo pipefail
        dotnet publish cli/ghul-cli.ghulproj -c Release -r linux-x64 \
          -p:PublishAot=true \
          -p:Version=${{ needs.version.outputs.package }} \
          -o build

        mv build/ghul-cli build/ghul

        # The native build's debug symbols: 25MB against a tool that is 8,
        # and nothing a user runs reads them.
        rm -f build/ghul-cli.dbg

    # The tool reads its own version by reflection off the assembly the
    # build produced, so a publish that forgets to be told the version
    # ships a tool that calls itself 1.0.0 - which is the MSBuild default,
    # and which nothing else in this job would notice. Checked rather than
    # assumed.
    - name: Check the tool reports this release's version
      shell: bash
      run: |
        set -euo pipefail
        reported="$(build/ghul --version 2>&1 | head -n 1)"
        echo "${reported}"

        if ! printf '%s' "${reported}" | grep -q -- "${{ needs.version.outputs.package }}"; then
          echo "the tool reports '${reported}'; expected version ${{ needs.version.outputs.package }}" >&2
          exit 1
        fi

    # `ghul update` takes its update path only in the Native AOT build, so it
    # is tested here, against a release mirror on the file system, rather
    # than in the smoke test, which runs the managed build.
    - name: Test ghul update
      shell: bash
      run: ./tests/update.sh build/ghul

    # The one property this whole thing exists for: what is installed runs
    # on its own. A binary that had picked up a dependency on the .NET
    # runtime, or an archive that carried a toolchain, would still install
    # and would still fail on the user's machine, so it is refused here
    # rather than shipped.
    - name: Check the archive is self-contained
      shell: bash
      run: |
        set -euo pipefail

        for binary in build/ghul; do
          if [ ! -x "${binary}" ]; then
            echo "${binary} is not executable" >&2
            exit 1
          fi

          if ldd "${binary}" 2>/dev/null | grep -qiE 'libcoreclr|libhostfxr|libhostpolicy|libstdc\+\+'; then
            echo "${binary} links a runtime or toolchain library:" >&2
            ldd "${binary}" >&2
            exit 1
          fi

          echo "${binary}: $(ldd "${binary}" | grep -c '=>' ) shared libraries, none of them .NET"
        done

        # The archive holds the tool and nothing else: no compiler, no
        # toolchain, no runtime, no package, no debug symbols. A stray file
        # from the publish fails here rather than shipping.
        actual="$(cd build && find . -type f | sed 's|^\./||' | sort)"

        if [ "${actual}" != "ghul" ]; then
          echo "the payload is not the tool alone:" >&2
          printf '%s\n' "${actual}" >&2
          exit 1
        fi

        echo "payload is exactly the tool."

    - name: Pack the archive
      shell: bash
      run: |
        set -euo pipefail
        tar -czf ghul-cli-linux-x64.tar.gz -C build ghul
        cp install.sh ghul-cli-install.sh
        sha256sum ghul-cli-linux-x64.tar.gz >ghul-cli-linux-x64.tar.gz.sha256
        sha256sum ghul-cli-install.sh >ghul-cli-install.sh.sha256
        cp install.ps1 ghul-cli-install.ps1
        sha256sum ghul-cli-install.ps1 >ghul-cli-install.ps1.sha256

    - uses: actions/upload-artifact@v7
      with:
        name: aot-archive
        path: |
          ghul-cli-linux-x64.tar.gz
          ghul-cli-linux-x64.tar.gz.sha256
          ghul-cli-install.sh
          ghul-cli-install.sh.sha256
          ghul-cli-install.ps1
          ghul-cli-install.ps1.sha256

  # The same tool for Linux on arm64, a Raspberry Pi among them, built on a
  # native arm64 runner so that the build and the smoke test below both run
  # on the architecture they are for. The archive holds the tool alone: ghul
  # runs the wasm-built compiler under Node on arm64, and fetches it.
  aot_release_archive_arm64:
    name: Build the Native AOT archive for arm64
    needs: [version]
    runs-on: ubuntu-24.04-arm

    timeout-minutes: 30

    if: ${{ github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install the native build tools
      run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev

    - name: Restore local tools
      run: dotnet tool restore

    - name: Build the tool with Native AOT
      shell: bash
      run: |
        set -euo pipefail
        dotnet publish cli/ghul-cli.ghulproj -c Release -r linux-arm64 \
          -p:PublishAot=true \
          -p:Version=${{ needs.version.outputs.package }} \
          -o build

        mv build/ghul-cli build/ghul
        rm -f build/ghul-cli.dbg

    - name: Check the tool reports this release's version
      shell: bash
      run: |
        set -euo pipefail
        reported="$(build/ghul --version 2>&1 | head -n 1)"
        echo "${reported}"

        if ! printf '%s' "${reported}" | grep -q -- "${{ needs.version.outputs.package }}"; then
          echo "the tool reports '${reported}'; expected version ${{ needs.version.outputs.package }}" >&2
          exit 1
        fi

    - name: Test ghul update
      shell: bash
      run: ./tests/update.sh build/ghul

    - name: Check the archive is self-contained
      shell: bash
      run: |
        set -euo pipefail

        if ldd build/ghul 2>/dev/null | grep -qiE 'libcoreclr|libhostfxr|libhostpolicy|libstdc\+\+'; then
          echo "build/ghul links a runtime or toolchain library:" >&2
          ldd build/ghul >&2
          exit 1
        fi

        actual="$(cd build && find . -type f | sed 's|^\./||' | sort)"

        if [ "${actual}" != "ghul" ]; then
          echo "the payload is not the tool alone:" >&2
          printf '%s\n' "${actual}" >&2
          exit 1
        fi

    # What a Raspberry Pi user does first, on an arm64 machine: a project
    # made by the tool, and its program built by the wasm-built compiler
    # under Node and run, with nothing of .NET on the path.
    - name: Make and run a project with the tool
      shell: bash
      run: |
        set -euo pipefail
        scratch="$(mktemp -d)"
        home="${scratch}/home"
        mkdir -p "${home}"

        ghul="${PWD}/build/ghul"
        node_directory="$(dirname "$(command -v node)")"
        cd "${scratch}"

        run() { env -i HOME="${home}" PATH="${node_directory}:/usr/bin:/bin" "${ghul}" "$@"; }

        run new hello
        cd hello
        out="$(run run)"
        echo "${out}"

        if ! printf '%s' "${out}" | grep -qi 'hello'; then
          echo "the program printed '${out}'" >&2
          exit 1
        fi

    - name: Pack the archive
      shell: bash
      run: |
        set -euo pipefail
        tar -czf ghul-cli-linux-arm64.tar.gz -C build ghul
        sha256sum ghul-cli-linux-arm64.tar.gz >ghul-cli-linux-arm64.tar.gz.sha256

    - uses: actions/upload-artifact@v7
      with:
        name: aot-archive-arm64
        path: |
          ghul-cli-linux-arm64.tar.gz
          ghul-cli-linux-arm64.tar.gz.sha256

  # The same tool for Windows on x64 and arm64 and for macOS on arm64. Native
  # AOT builds on the operating system it is for, so each is built on a runner
  # of its own, and the archive is installed and used there, with no .NET on
  # the PATH: what a user without .NET does first. The archive holds the tool
  # alone, as the Linux ones do; ghul runs its compiler under Node and fetches
  # both.
  aot_release_archive_desktop:
    name: Build the Native AOT archive for ${{ matrix.rid }}
    needs: [version]
    runs-on: ${{ matrix.runner }}

    timeout-minutes: 45

    if: ${{ github.event_name != 'pull_request' || contains(github.head_ref, 'aot-platforms') }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: win-x64
          runner: windows-latest
          extension: zip
        - rid: win-arm64
          runner: windows-11-arm
          extension: zip
        - rid: osx-arm64
          runner: macos-latest
          extension: tar.gz

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local tools
      run: dotnet tool restore

    - name: Build the tool with Native AOT
      shell: bash
      run: |
        set -euo pipefail
        dotnet publish cli/ghul-cli.ghulproj -c Release -r ${{ matrix.rid }} \
          -p:PublishAot=true \
          -p:Version=${{ needs.version.outputs.package }} \
          -o build

        if [ -f build/ghul-cli.exe ]; then
          mv build/ghul-cli.exe build/ghul.exe
        else
          mv build/ghul-cli build/ghul
        fi

        # The native build's debug symbols, which nothing a user runs reads.
        rm -f build/ghul-cli.dbg build/ghul-cli.pdb build/ghul.pdb
        rm -rf build/ghul-cli.dSYM

    - name: Check the tool reports this release's version
      shell: bash
      run: |
        set -euo pipefail
        tool=build/ghul
        if [ -f build/ghul.exe ]; then tool=build/ghul.exe; fi

        reported="$("${tool}" --version 2>&1 | head -n 1)"
        echo "${reported}"

        if ! printf '%s' "${reported}" | grep -q -- "${{ needs.version.outputs.package }}"; then
          echo "the tool reports '${reported}'; expected version ${{ needs.version.outputs.package }}" >&2
          exit 1
        fi

    # The archive holds the tool and nothing else, and on macOS the tool links
    # no .NET runtime library.
    - name: Check the archive is self-contained
      shell: bash
      run: |
        set -euo pipefail

        expected=ghul
        if [ -f build/ghul.exe ]; then expected=ghul.exe; fi

        actual="$(cd build && find . -type f | sed 's|^\./||' | sort)"

        if [ "${actual}" != "${expected}" ]; then
          echo "the payload is not the tool alone:" >&2
          printf '%s\n' "${actual}" >&2
          exit 1
        fi

        if [ "${{ matrix.rid }}" = osx-arm64 ]; then
          if otool -L build/ghul | grep -qiE 'libcoreclr|libhostfxr|libhostpolicy'; then
            echo "build/ghul links a .NET runtime library:" >&2
            otool -L build/ghul >&2
            exit 1
          fi

          otool -L build/ghul
        fi

        echo "payload is exactly the tool."

    - name: Pack the archive
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist

        if [ "${{ matrix.extension }}" = zip ]; then
          pwsh -NoProfile -Command "Compress-Archive -Path build/ghul.exe -DestinationPath dist/ghul-cli-${{ matrix.rid }}.zip"
        else
          tar -czf dist/ghul-cli-${{ matrix.rid }}.tar.gz -C build ghul
        fi

        cd dist

        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum ghul-cli-${{ matrix.rid }}.${{ matrix.extension }} >ghul-cli-${{ matrix.rid }}.${{ matrix.extension }}.sha256
        else
          shasum -a 256 ghul-cli-${{ matrix.rid }}.${{ matrix.extension }} >ghul-cli-${{ matrix.rid }}.${{ matrix.extension }}.sha256
        fi

    - name: Install the archive and use it, on macOS
      if: ${{ matrix.rid == 'osx-arm64' }}
      shell: bash
      run: ./tests/smoke-install.sh dist ${{ matrix.rid }} ${{ needs.version.outputs.package }}

    - name: Install the archive and use it, on Windows
      if: ${{ startsWith(matrix.rid, 'win-') }}
      shell: pwsh
      run: ./tests/smoke-install.ps1 -Archives dist -Rid ${{ matrix.rid }} -Version ${{ needs.version.outputs.package }}

    # `ghul update` takes its update path only in the Native AOT build, against
    # a release mirror on the file system.
    - name: Test ghul update, on macOS
      if: ${{ matrix.rid == 'osx-arm64' }}
      shell: bash
      run: ./tests/update.sh build/ghul

    - name: Test ghul update, on Windows
      if: ${{ startsWith(matrix.rid, 'win-') }}
      shell: pwsh
      run: ./tests/update.ps1 -Executable (Resolve-Path build/ghul.exe) -Rid ${{ matrix.rid }}

    - uses: actions/upload-artifact@v7
      with:
        name: aot-archive-${{ matrix.rid }}
        path: |
          dist/ghul-cli-${{ matrix.rid }}.${{ matrix.extension }}
          dist/ghul-cli-${{ matrix.rid }}.${{ matrix.extension }}.sha256

  create_release:
    needs: [version, publish_package, aot_release_archive, aot_release_archive_arm64, aot_release_archive_desktop]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Download the Native AOT archive
      uses: actions/download-artifact@v8
      with:
        name: aot-archive
        path: aot

    - name: Download the Native AOT archive for arm64
      uses: actions/download-artifact@v8
      with:
        name: aot-archive-arm64
        path: aot

    - name: Download the Native AOT archives for Windows and macOS
      uses: actions/download-artifact@v8
      with:
        pattern: aot-archive-*
        path: aot
        merge-multiple: true

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul.cli.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.repl.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.repl.host.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.jupyter.${{ needs.version.outputs.package }}.nupkg \
          ./nupkg/ghul.project.${{ needs.version.outputs.package }}.nupkg \
          ./aot/ghul-cli-linux-x64.tar.gz \
          ./aot/ghul-cli-linux-x64.tar.gz.sha256 \
          ./aot/ghul-cli-linux-arm64.tar.gz \
          ./aot/ghul-cli-linux-arm64.tar.gz.sha256 \
          ./aot/ghul-cli-win-x64.zip \
          ./aot/ghul-cli-win-x64.zip.sha256 \
          ./aot/ghul-cli-win-arm64.zip \
          ./aot/ghul-cli-win-arm64.zip.sha256 \
          ./aot/ghul-cli-osx-arm64.tar.gz \
          ./aot/ghul-cli-osx-arm64.tar.gz.sha256 \
          ./aot/ghul-cli-install.ps1 \
          ./aot/ghul-cli-install.ps1.sha256 \
          ./aot/ghul-cli-install.sh \
          ./aot/ghul-cli-install.sh.sha256 \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt

